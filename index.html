<script>
/* ================= CONFIG ================= */

const WEBHOOK_URL  = "https://script.google.com/macros/s/AKfycbxBMhehIEOXZhE02SR7lwx1pYhDEuvqwF5e0eK7JL1ppAKlkdgnW-BdAI9DhRqzNsmAMQ/exec";
const DOWNLOAD_URL = "https://drive.google.com/uc?export=download&id=1PXjjtpXMKfF4VT458npiSpulp8KTGYVX";
const CHECKOUT_URL = "https://pay.kiwify.com.br/lftUD8U";

/* ================= HELPERS ================= */

const toastEl = () => document.getElementById('toast');

function showToast(msg, ok = true) {
  const el = toastEl();
  if (!el) return;

  el.textContent = msg;

  el.className =
    "fixed inset-x-0 top-4 z-50 mx-auto w-[92%] max-w-md rounded-xl px-4 py-3 text-center text-sm font-semibold " +
    (ok ? "bg-emerald-500 text-white" : "bg-red-500 text-white");

  el.classList.remove("hidden");

  setTimeout(() => {
    el.classList.add("hidden");
  }, 3500);
}

const isEmail = (v) =>
  /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || "").trim());

const getUTMs = () => {
  const p = new URLSearchParams(location.search);
  return {
    utm_source: p.get("utm_source") || "",
    utm_medium: p.get("utm_medium") || "",
    utm_campaign: p.get("utm_campaign") || "",
    utm_content: p.get("utm_content") || "",
    utm_term: p.get("utm_term") || ""
  };
};

/* ================= PAGE LOAD ================= */

document.addEventListener("DOMContentLoaded", () => {

  document.getElementById("year").textContent =
    new Date().getFullYear();

  /* ===== MENU MOBILE ===== */

  const btn = document.getElementById("hamburger");
  const menu = document.getElementById("mobileMenu");
  const iconOpen = document.getElementById("iconOpen");
  const iconClose = document.getElementById("iconClose");

  if (btn) {
    btn.addEventListener("click", () => {
      menu.classList.toggle("hidden");
      iconOpen.classList.toggle("hidden");
      iconClose.classList.toggle("hidden");
    });
  }

  /* ===== CHECKOUT LINK ===== */

  const buy = document.getElementById("buyNow");
  if (buy) buy.href = CHECKOUT_URL;

  /* ================= TIMER ================= */

  function endOfDay() {
    const d = new Date();
    return new Date(
      d.getFullYear(),
      d.getMonth(),
      d.getDate(),
      23,
      59,
      59
    ).getTime();
  }

  function formatHMS(ms) {
    if (ms <= 0) return "00:00:00";

    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;

    const pad = (n) => String(n).padStart(2, "0");

    return `${pad(h)}:${pad(m)}:${pad(sec)}`;
  }

  const tEl = document.getElementById("timer");

  function tick() {
    const diff = endOfDay() - Date.now();
    if (tEl) tEl.textContent = formatHMS(diff);
  }

  tick();
  setInterval(tick, 1000);

  /* ================= FORM ================= */

  const form = document.getElementById("leadForm");
  const btnSubmit = document.getElementById("submitBtn");

  if (!form) return;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(form).entries());

    /* ===== ANTISPAM ===== */

    if ((data.website || "").trim()) {
      return;
    }

    /* ===== VALIDAÇÃO ===== */

    if (!data.name || data.name.length < 2) {
      showToast("Digite seu nome.", false);
      return;
    }

    if (!isEmail(data.email)) {
      showToast("Digite um e-mail válido.", false);
      return;
    }

    if (!data.consent) {
      showToast("Você precisa aceitar os termos.", false);
      return;
    }

    /* ===== PAYLOAD ===== */

    const payload = {
      name: data.name,
      email: data.email,
      whatsapp: data.whatsapp || "",
      consent: true,
      page: location.href,
      ts: new Date().toISOString(),
      ...getUTMs()
    };

    /* ================= ENVIO ================= */

    try {

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Enviando...";

      await fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      showToast("Liberando download...", true);

      /* ===== DOWNLOAD ===== */

      setTimeout(() => {
        window.open(DOWNLOAD_URL, "_blank");
      }, 800);

      form.reset();

    } catch (err) {

      console.error(err);

      showToast("Erro ao enviar. Baixando direto...", false);

      /* fallback download */

      window.open(DOWNLOAD_URL, "_blank");

    } finally {

      btnSubmit.disabled = false;
      btnSubmit.textContent = "Quero baixar grátis";

    }
  });
});
</script>
