<script>

const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxBMhehIEOXZhE02SR7lwx1pYhDEuvqwF5e0eK7JL1ppAKlkdgnW-BdAI9DhRqzNsmAMQ/exec";
const DOWNLOAD_URL = "https://drive.google.com/uc?export=download&id=1PXjjtpXMKfF4VT458npiSpulp8KTGYVX";

function isEmail(email){
return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

document.addEventListener("DOMContentLoaded", () => {

const form = document.getElementById("leadForm");
const btn  = document.getElementById("submitBtn");

if(!form) return;

form.addEventListener("submit", function(e){

e.preventDefault();

const data = new FormData(form);
data.append("page", window.location.href);

const name = data.get("name");
const email = data.get("email");

if(!name || name.length < 2){
alert("Digite seu nome");
return;
}

if(!isEmail(email)){
alert("Digite um email válido");
return;
}

btn.disabled = true;
btn.innerText = "Enviando...";

fetch(WEBHOOK_URL,{
method:"POST",
mode:"no-cors",
body:data
});

setTimeout(()=>{

const link = document.createElement("a");
link.href = DOWNLOAD_URL;
link.target = "_blank";

document.body.appendChild(link);
link.click();
link.remove();

},800);

form.reset();

btn.disabled = false;
btn.innerText = "Baixar Ebook";

});

});

</script>
