<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartMarmita</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{font-family:Arial;background:#fff;color:#0f172a}
.btn{padding:14px 22px;border-radius:10px;font-weight:700}
.btn-primary{background:#16a34a;color:#fff}
</style>
</head>

<body>

<section style="max-width:900px;margin:auto;padding:40px">

<h1 style="font-size:32px;font-weight:800;margin-bottom:10px">
SmartMarmita
</h1>

<p style="margin-bottom:30px">
Baixe gratuitamente o mini ebook.
</p>

<form id="leadForm" style="display:grid;gap:14px">

<input name="name" placeholder="Seu nome" required style="padding:12px;border:1px solid #ddd;border-radius:8px">

<input name="email" type="email" placeholder="Seu email" required style="padding:12px;border:1px solid #ddd;border-radius:8px">

<input name="whatsapp" placeholder="WhatsApp" style="padding:12px;border:1px solid #ddd;border-radius:8px">

<label style="font-size:14px">
<input type="checkbox" name="consent" required>
 Concordo em receber comunicações
</label>

<button id="submitBtn" class="btn btn-primary">
Baixar Ebook
</button>

</form>

<p id="status"></p>

</section>

<script>

const WEBHOOK_URL  = "https://script.google.com/macros/s/AKfycbw3DFLjVjm9f7j3Jw4ZKGXRPcgCdXNQSEBAEdCnxtbPNgVRreZ78lMEzewt6RbUwhHP/exec";

const DOWNLOAD_URL = "https://drive.google.com/uc?export=download&id=1PXjjtpXMKfF4VT458npiSpulp8KTGYVX";


document.addEventListener("DOMContentLoaded", () => {

const form = document.getElementById("leadForm");
const btn  = document.getElementById("submitBtn");

form.addEventListener("submit", function(e){

e.preventDefault();

const data = new FormData(form);

const name  = data.get("name");
const email = data.get("email");

if(!name || name.length < 2){
alert("Digite seu nome");
return;
}

if(!email.includes("@")){
alert("Digite um email válido");
return;
}

btn.disabled = true;
btn.innerText = "Enviando...";

/* envio para planilha */



fetch(WEBHOOK_URL,{
method:"POST",
mode:"no-cors",
body:data
});

/* download garantido */

setTimeout(()=>{

const link = document.createElement("a");
link.href = DOWNLOAD_URL;
link.target = "_blank";
document.body.appendChild(link);
link.click();
link.remove();

},800);

btn.disabled = false;
btn.innerText = "Baixar Ebook";

form.reset();

});

});

</script>

</body>
</html>
