<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SmartMarmita - Ebook Gratuito</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
font-family:Arial;
background:#f8fafc;
color:#0f172a;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.hero{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.btn{
padding:14px 24px;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.btn-primary{
background:#16a34a;
color:#fff;
}

.card{
background:#fff;
padding:30px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

@media(max-width:800px){
.hero{
grid-template-columns:1fr;
}
}

</style>

</head>
<body>

<div class="container">

<div class="hero">

<div>

<h1 style="font-size:42px;font-weight:800;margin-bottom:20px">
SmartMarmita
</h1>

<p style="font-size:20px;margin-bottom:20px">
Aprenda a preparar marmitas saudáveis, baratas e práticas para a semana inteira.
</p>

<ul style="margin-bottom:25px;line-height:1.8">
<li>✔ Economize dinheiro</li>
<li>✔ Coma melhor</li>
<li>✔ Organize sua rotina</li>
</ul>

</div>

<div class="card">

<h2 style="font-size:26px;font-weight:700;margin-bottom:10px">
Baixar Ebook Gratuito
</h2>

<p style="margin-bottom:20px">
Preencha abaixo para receber agora.
</p>

<form id="leadForm" style="display:grid;gap:14px">

<input name="name" placeholder="Seu nome" required>

<input name="email" type="email" placeholder="Seu email" required>

<input name="whatsapp" placeholder="WhatsApp">

<label style="font-size:14px">
<input type="checkbox" name="consent" required>
 Concordo em receber comunicações
</label>

<button id="submitBtn" class="btn btn-primary">
Baixar Ebook
</button>

</form>

<p id="status"></p>

</div>

</div>

</div>

<script>

const WEBHOOK_URL  = "https://script.google.com/macros/s/AKfycbw3DFLjVjm9f7j3Jw4ZKGXRPcgCdXNQSEBAEdCnxtbPNgVRreZ78lMEzewt6RbUwhHP/exec";

const DOWNLOAD_URL = "https://drive.google.com/uc?export=download&id=1PXjjtpXMKfF4VT458npiSpulp8KTGYVX";

document.addEventListener("DOMContentLoaded", () => {

const form = document.getElementById("leadForm");
const btn  = document.getElementById("submitBtn");

form.addEventListener("submit", function(e){

e.preventDefault();

const data = new FormData(form);
data.append("page", window.location.href);

const name  = data.get("name");
const email = data.get("email");

if(!name || name.length < 2){
alert("Digite seu nome");
return;
}

if(!email.includes("@")){
alert("Digite um email válido");
return;
}

btn.disabled = true;
btn.innerText = "Enviando...";

fetch(WEBHOOK_URL,{
method:"POST",
mode:"no-cors",
body:data
});

setTimeout(()=>{

const link = document.createElement("a");
link.href = DOWNLOAD_URL;
link.target = "_blank";
document.body.appendChild(link);
link.click();
link.remove();

},800);

btn.disabled = false;
btn.innerText = "Baixar Ebook";

form.reset();

});

});

</script>

</body>
</html>
